<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♡ Open Me ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffe6f0;
            font-family: "Trebuchet MS", Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        .instruction {
            color: #a66a7d;
            font-size: 18px;
            margin-bottom: 40px;
            animation: floatingText 2s ease-in-out infinite;
        }

        .envelope {
            position: relative;
            width: 320px;
            height: 210px;
            cursor: pointer;
            perspective: 900px;
            transition: transform 0.3s ease, opacity 0.5s ease;
            filter: drop-shadow(0 15px 20px rgba(190, 90, 130, 0.20));
        }

        .envelope:hover {
            transform: translateY(-8px) scale(1.03);
        }

        .letter {
            position: absolute;
            width: 250px;
            height: 155px;
            left: 35px;
            bottom: 15px;
            background: #fffafb;
            border-radius: 5px;
            z-index: 1;
            box-shadow: 0 5px 12px rgba(150, 70, 100, 0.12);
            transition: transform 1s ease, z-index 0s linear 0.5s;
        }

        .letter::before {
            content: "";
            position: absolute;
            top: 12px;
            left: 20px;
            right: 20px;
            height: 2px;
            background: #f5d3df;
            box-shadow: 0 12px 0 #f5d3df, 0 24px 0 #f5d3df;
        }

        .letter::after {
            content: "♡";
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            color: #e47ba0;
            font-size: 38px;
        }

        .body {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 320px;
            height: 170px;
            background: #f9b6ce;
            border-radius: 8px;
            z-index: 3;
            overflow: hidden;
        }

        .body::before {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-top: 85px solid transparent;
            border-bottom: 85px solid transparent;
            border-left: 160px solid #f6a9c4;
        }

        .body::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-top: 85px solid transparent;
            border-bottom: 85px solid transparent;
            border-right: 160px solid #f6a9c4;
        }

        .flap {
            position: absolute;
            top: 40px;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 100px solid #f4a5c1;
            transform-origin: top center;
            transition: transform 1s ease;
            z-index: 4;
        }

        .seal {
            position: absolute;
            top: 115px;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e8789f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(200, 80, 120, 0.25);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .envelope.open .flap {
            transform: rotateX(180deg);
        }

        .envelope.open .letter {
            z-index: 6;
            transform: translateY(-135px);
        }

        .envelope.open .seal {
            opacity: 0;
            transform: translateX(-50%) scale(0.7);
        }

        @keyframes floatingText {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .floating-heart {
            position: fixed;
            color: #e89ab7;
            opacity: 0;
            pointer-events: none;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.45;
            }

            80% {
                opacity: 0.45;
            }

            100% {
                transform: translateY(-100px) rotate(25deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .envelope {
                transform: scale(0.85);
            }

            .envelope:hover {
                transform: scale(0.88);
            }

            .instruction {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="instruction">
            ♡ click the envelope to open ♡
        </div>

        <div class="envelope" id="envelope" onclick="openEnvelope()">

            <div class="letter"></div>

            <div class="body"></div>

            <div class="flap"></div>

            <div class="seal">
                ♥
            </div>

        </div>

    </div>

    <script>
        function openEnvelope() {
            const envelope = document.getElementById("envelope");

            if (envelope.classList.contains("open")) {
                return;
            }

            envelope.classList.add("open");

            setTimeout(function () {
                window.location.href = "letter.html";
            }, 1500);
        }

        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "floating-heart";
            heart.innerHTML = Math.random() > 0.5 ? "♡" : "♥";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (12 + Math.random() * 18) + "px";
            heart.style.animationDuration = (5 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(function () {
                heart.remove();
            }, 10000);
        }

        setInterval(createHeart, 1000);
    </script>

</body>
</html>
